[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nora_devstack"]

[project]
name = "nora-devstack"
version = "0.1.0"
description = "NORA One-Command Devstack Orchestrator and Synthetic Workflow Runner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.0",
]

[project.scripts]
nora-dev = "nora_devstack.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
