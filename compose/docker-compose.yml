services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nora
      POSTGRES_PASSWORD: nora-dev-only
      POSTGRES_DB: nora_dev
    ports: ["54329:5432"]
  object-store:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: nora-dev
      MINIO_ROOT_PASSWORD: nora-dev-only-change-me
    ports: ["59000:9000", "59001:9001"]
