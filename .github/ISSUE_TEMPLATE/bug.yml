name: Bug report
description: Report a reproducible defect without private Matter data
body:
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: actual
    attributes: {label: Actual behavior}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Synthetic reproducer}
    validations: {required: true}
